<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="-apple-system, 'Pretendard Variable', Pretendard, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>

  <text x="40" y="42" font-size="26" font-weight="800" fill="#111111">V2X 데이터 통신 미들웨어 — 시스템 구성도</text>
  <text x="40" y="66" font-size="14" fill="#71717a">경찰청 자율주행 순찰차 프로토타입 · 종단간 지연 100ms 이내 목표</text>

  <!-- Vendor boundary -->
  <rect x="30" y="95" width="260" height="150" rx="12" fill="none" stroke="#ff3b3b" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="45" y="118" font-size="12" font-weight="700" fill="#ff3b3b">외부 벤더(M사) 경계</text>

  <!-- M사 box -->
  <rect x="50" y="132" width="220" height="90" rx="10" fill="#111111"/>
  <rect x="46" y="128" width="220" height="90" rx="10" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="156" y="163" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">M사</text>
  <text x="156" y="184" font-size="12.5" fill="#3f3f46" text-anchor="middle">통신/보안모듈</text>
  <text x="156" y="202" font-size="12.5" fill="#3f3f46" text-anchor="middle">(Client, 능동 push)</text>

  <!-- arrow M사 -> Socket Server -->
  <line x1="270" y1="173" x2="366" y2="173" stroke="#111111" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="318" y="160" font-size="11" fill="#71717a" text-anchor="middle">ASN.1 원본 push</text>

  <!-- Socket Server box -->
  <rect x="378" y="132" width="240" height="90" rx="10" fill="#111111"/>
  <rect x="374" y="128" width="240" height="90" rx="10" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="494" y="155" font-size="11" font-weight="700" fill="#71717a" text-anchor="middle">① 수신 레이어</text>
  <text x="494" y="178" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">TCP Socket Server</text>
  <text x="494" y="198" font-size="12.5" fill="#3f3f46" text-anchor="middle">Java 17 / Spring Boot</text>

  <!-- arrow Socket -> Parser -->
  <line x1="622" y1="173" x2="718" y2="173" stroke="#111111" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Parser box -->
  <rect x="730" y="122" width="260" height="110" rx="10" fill="#111111"/>
  <rect x="726" y="118" width="260" height="110" rx="10" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="856" y="145" font-size="11" font-weight="700" fill="#71717a" text-anchor="middle">② 파싱 레이어</text>
  <text x="856" y="168" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">ASN.1 → C 구조체 파싱</text>
  <text x="856" y="188" font-size="12" fill="#3f3f46" text-anchor="middle">Header / Data Segment / Trailer</text>
  <text x="856" y="206" font-size="12" fill="#3f3f46" text-anchor="middle">ByteBuffer Endianness 명시 지정</text>

  <!-- arrow Parser -> Protobuf -->
  <line x1="990" y1="173" x2="1086" y2="173" stroke="#111111" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Protobuf box -->
  <rect x="1098" y="132" width="240" height="90" rx="10" fill="#111111"/>
  <rect x="1094" y="128" width="240" height="90" rx="10" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="1214" y="155" font-size="11" font-weight="700" fill="#71717a" text-anchor="middle">③ 내부 파이프라인 연동</text>
  <text x="1214" y="178" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">Protocol Buffers</text>
  <text x="1214" y="198" font-size="12.5" fill="#3f3f46" text-anchor="middle">재직렬화 (JSON 대비 ~60%↓)</text>

  <!-- arrow down to Kafka -->
  <line x1="1214" y1="222" x2="1214" y2="290" stroke="#111111" stroke-width="3"/>
  <line x1="1214" y1="290" x2="770" y2="290" stroke="#111111" stroke-width="3"/>
  <line x1="770" y1="290" x2="770" y2="338" stroke="#111111" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Kafka box (highlight, yellow) -->
  <rect x="530" y="356" width="480" height="96" rx="12" fill="#111111"/>
  <rect x="524" y="350" width="480" height="96" rx="12" fill="#ffde59" stroke="#111111" stroke-width="3"/>
  <text x="764" y="388" font-size="17" font-weight="800" fill="#111111" text-anchor="middle">Apache Kafka — V2X 데이터 백본</text>
  <text x="764" y="410" font-size="12.5" fill="#111111" text-anchor="middle">파티셔닝된 로그로 메시지 재생 · 다중 컨슈머 독립 구독</text>
  <text x="764" y="428" font-size="12.5" fill="#111111" text-anchor="middle">종단간 지연 80ms 미만 · 전달률 99.8%</text>

  <!-- three consumer arrows -->
  <path d="M650,446 L650,470 L300,470 L300,494" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M764,446 L764,494" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M880,446 L880,470 L1140,470 L1140,494" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Redis box -->
  <rect x="184" y="506" width="232" height="112" rx="10" fill="#111111"/>
  <rect x="180" y="502" width="232" height="112" rx="10" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="296" y="530" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">Redis</text>
  <text x="296" y="552" font-size="12" fill="#3f3f46" text-anchor="middle">무상태(Stateless) 미들웨어</text>
  <text x="296" y="570" font-size="12" fill="#3f3f46" text-anchor="middle">TTL 기반 처리중 메시지 상태</text>
  <text x="296" y="588" font-size="12" fill="#3f3f46" text-anchor="middle">차량 재연결 시 복구</text>

  <!-- Dashboard box -->
  <rect x="648" y="506" width="232" height="112" rx="10" fill="#111111"/>
  <rect x="644" y="502" width="232" height="112" rx="10" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="760" y="530" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">모니터링 대시보드</text>
  <text x="760" y="552" font-size="12" fill="#3f3f46" text-anchor="middle">V2X 데이터 흐름 시각화</text>
  <text x="760" y="570" font-size="12" fill="#3f3f46" text-anchor="middle">전송 이상 감지 · 현장 테스트</text>
  <text x="760" y="588" font-size="12" fill="#3f3f46" text-anchor="middle">디버깅용 Kafka 재생</text>

  <!-- ECU / infra box -->
  <rect x="1024" y="506" width="260" height="112" rx="10" fill="#111111"/>
  <rect x="1020" y="502" width="260" height="112" rx="10" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="1150" y="530" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">차량 ECU / 도로변 인프라</text>
  <text x="1150" y="552" font-size="12" fill="#3f3f46" text-anchor="middle">Vehicle-to-Everything 유닛</text>
  <text x="1150" y="570" font-size="12" fill="#3f3f46" text-anchor="middle">실시간 데이터 위 상위 레벨</text>
  <text x="1150" y="588" font-size="12" fill="#3f3f46" text-anchor="middle">의사결정 로직 구현</text>

  <!-- footer note -->
  <rect x="40" y="660" width="1320" height="180" rx="12" fill="#faf9f6" stroke="#e4e4e7" stroke-width="1.5"/>
  <text x="60" y="692" font-size="13" font-weight="700" fill="#111717" fill-opacity="0.85">설계 포인트</text>
  <text x="60" y="716" font-size="12.5" fill="#3f3f46">→ M사(통신/보안모듈)가 외부 인바운드 연결을 최소화해야 하는 보안 정책 때문에, 데이터 플랫폼이 서버로 대기하고 M사가 클라이언트로 능동 접속해 push하는 구조로 설계</text>
  <text x="60" y="740" font-size="12.5" fill="#3f3f46">→ ASN.1(Header/Data Segment/Trailer, SAE J2735 기반) 원본을 C 구조체 스키마로 직접 파싱 — 이 과정에서 M사 시스템과의 바이트 오더(Endianness) 불일치로 정수 필드가 역순 파싱되는 문제를 발견,</text>
  <text x="80" y="762" font-size="12.5" fill="#3f3f46">ByteBuffer의 바이트 오더를 명시적으로 지정해 해결</text>
  <text x="60" y="786" font-size="12.5" fill="#3f3f46">→ 파싱이 끝난 데이터만 Protocol Buffers로 재직렬화해 내부 Kafka 파이프라인에 태우는 방식으로, 외부 규격(ASN.1)과 내부 규격(Protobuf)의 경계를 명확히 분리</text>
  <text x="60" y="810" font-size="12.5" fill="#3f3f46">→ Redis 기반 무상태 미들웨어로 수평 확장이 가능하고, TTL로 처리 중 메시지 상태를 저장해 차량 재연결 시에도 이어서 처리</text>
</svg>
